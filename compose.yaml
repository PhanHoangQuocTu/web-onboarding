services:
  arsketch:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - edge

  db:
    image: postgres:16-alpine
    env_file:
      - .env.local
    ports:
      - '127.0.0.1:5439:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:

networks:
  edge:
    external: true
